[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "configsentry"
version = "1.0.0"
description = "Config drift auditor for Linux hosts: capture a baseline, detect drift."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Shane Thomas" }]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
configsentry = "configsentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/configsentry"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
