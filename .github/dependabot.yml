version: 2
updates:
  # Python dependencies declared in pyproject.toml (typer, pydantic, rich,
  # PyYAML, plus the [dev] extras: pytest, ruff, etc.)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # The GitHub Actions themselves (actions/checkout, actions/setup-python,
  # etc.) -- these are their own dependency surface and go stale too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
