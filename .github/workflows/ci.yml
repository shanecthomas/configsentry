name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: lint & unit test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint check
        run: ruff check .

      - name: Unit tests
        run: pytest --cov=configsentry --cov-report=term-missing

  build:
    name: build & smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Install wheel into a fresh environment
        run: |
          python -m venv /tmp/smoke-test-venv
          /tmp/smoke-test-venv/bin/pip install dist/*.whl

      - name: Smoke test the installed CLI
        run: |
          /tmp/smoke-test-venv/bin/configsentry --help
          /tmp/smoke-test-venv/bin/configsentry baseline --help
          /tmp/smoke-test-venv/bin/configsentry check --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
