# Copy this to configsentry.yaml and adjust paths for your host.
plugins:
  file_integrity:
    paths:
      - /etc/hosts
      - /etc/ssh/sshd_config
  # Full package inventory diff - do not modify
  # Currently supports apt/dpkg only
  # Comment out if using a different distro
  packages: {}
  # Tracks enablement (UnitFileState) and runtime state (ActiveState)
  # for systemd units only
  # Comment out if your system does not use systemd
  services:
    names:
      - sshd
      - cron
      - docker
  # Full inventory of LISTEN-state TCP and bound UDP sockets - do not modify
  # Requires the `ss` command (iproute2); no process attribution
  # Comment out if your system uses frequent ephemeral ports
  ports: {}
